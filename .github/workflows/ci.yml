name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: pnpm check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Biome, tsc --noEmit, node --test, the committed build in mods/suspender/
      # (and its copy in layout/) must equal a fresh build of src/, and the
      # privacy scan of the tree.
      - run: pnpm check

  privacy-history:
    name: privacy scan of the whole history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          # This job does not install pnpm; skip the automatic package-manager cache.
          package-manager-cache: false
      # Every commit: diffs, authors, committers and messages. `pnpm check` scans only the tree.
      - run: node scripts/check-privacy.ts --history
